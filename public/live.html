<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Large screen – Berget Tolk</title>
<link rel="stylesheet" href="/berget-ui.css">
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--berget-font-sans);
    background: #0A0A0A; color: #fff; position: relative;  /* Night / Peak */
  }

  /* Berget AI-branding, vänstra hörnet */
  #brand {
    position: fixed; top: 3.6vh; left: 3.4vw; height: 3.9vh; width: auto;
    opacity: .55; z-index: 5;
  }

  /* Captions – live-TV style */
  #captions {
    position: absolute; left: 0; right: 0; bottom: 6vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 6vw; text-align: center;
  }
  #captions .block + .block { margin-top: 4.5vh; }   /* "mellanrummet" efter tystnad */
  #captions p {
    font-size: clamp(1.8rem, 3.6vw, 3.4rem); font-weight: 700; line-height: 1.3;
    margin: .35rem 0; max-width: 75rem;
    text-shadow: 0 2px 14px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9);
  }
  #captions p.old { opacity: .45; font-weight: 600; }
  #captions p.partial { color: #fff; opacity: .7; font-weight: 600; }
  #captions p.speaker-start { margin-top: 3vh; }

  /* Persistent QR card, for late arrivals (closable) */
  #qrpanel {
    position: absolute; top: 2.5vh; right: 2.5vh;
    background: #fff; color: #1A1A1A; border-radius: 1rem;  /* Peak / Slate */
    padding: 1rem 1.2rem; text-align: center; width: 190px; display: none;
  }
  #qr-close {
    position: absolute; top: .25rem; right: .45rem; border: none; background: none;
    color: rgba(26,26,26,.45); font-size: 1.15rem; line-height: 1; cursor: pointer; padding: .2rem;
  }
  #qr-close:hover { color: #1A1A1A; }
  #qr-open {
    position: absolute; top: 2.5vh; right: 2.5vh; display: none;
    border: none; cursor: pointer; border-radius: .7rem; padding: .6rem;
    background: rgba(255,255,255,.08); color: #fff; opacity: .45;
  }
  #qr-open:hover { opacity: 1; background: rgba(255,255,255,.15); }
  #qr-open svg { display: block; width: 28px; height: 28px; }
  #qrpanel img { width: 100%; display: block; }
  #qrpanel .code {
    font-family: var(--berget-font-mono); font-weight: 800; font-size: 1.25rem;
    letter-spacing: .22em; text-indent: .22em; margin-top: .55rem; color: #1A1A1A;
  }
  #qrpanel .hint { font-size: .72rem; color: rgba(26,26,26,.6); margin-top: .4rem; line-height: 1.45; }

  /* Broadcaster controls – discreet, bottom right */
  #controls {
    position: absolute; bottom: 2vh; right: 2vw;
    display: flex; align-items: center; gap: .6rem;
  }
  #toggle {
    padding: .7rem 1.2rem; font-size: 1rem; font-weight: 600;
    border-radius: .6rem 0 0 .6rem; border: none; cursor: pointer;
    background: #52B788; color: #0A0A0A;  /* Moss / Night */
  }
  #toggle.stop, #micbtn.stop { background: #D1392E; color: #fff; }  /* Error */
  #toggle:disabled { opacity: .45; cursor: default; }
  /* Split-button: source picker behind the ▾ chevron */
  #micwrap { position: relative; display: flex; }
  #micbtn {
    padding: .7rem .75rem; font-size: 1rem; border: none; cursor: pointer;
    background: #52B788; color: #0A0A0A; border-radius: 0 .6rem .6rem 0;
    border-left: 1px solid rgba(0,0,0,.35);
  }
  #micbtn:hover { filter: brightness(1.08); }
  #micmenu {
    position: absolute; bottom: calc(100% + .6rem); right: 0; min-width: 16rem;
    background: #1A1A1A; border: 1px solid #2a2a2a; border-radius: .7rem;  /* Slate */
    padding: .35rem; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #micmenu .menu-label {
    padding: .4rem .7rem .3rem; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .08em; color: rgba(255,255,255,.45);
  }
  #micmenu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: rgba(255,255,255,.85); padding: .55rem .7rem; border-radius: .45rem;
    cursor: pointer; font-size: .9rem;
  }
  #micmenu button:hover { background: rgba(255,255,255,.08); }
  #micmenu button.cur { color: #52B788; font-weight: 700; }

  /* Discreet status, bottom left – the dot breathes with your voice */
  #status {
    position: absolute; bottom: 2vh; left: 2vw; font-size: .95rem; color: #999;
    display: flex; align-items: center; gap: .5rem; max-width: 45vw;
  }
  #dot {
    width: .9rem; height: .9rem; border-radius: 50%; background: #555; flex: none;
    transition: background .2s;
  }
  #status.live #dot { background: #52B788; }
  #status.error #dot { background: #D1392E; }
</style>
</head>
<body>
<img id="brand" src="/berget-logo.svg" alt="Berget AI">
<div id="captions"></div>
<div id="qrpanel">
  <button id="qr-close" aria-label="Hide QR code" title="Hide QR">×</button>
  <img id="qr" alt="QR code">
  <div class="code" id="code"></div>
  <div class="hint">Scan to read live captions<br>on your phone<br>– in your language</div>
</div>
<button id="qr-open" aria-label="Show QR code" title="Show QR code">
  <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="3" y="3" width="9" height="9"/><rect x="16" y="3" width="9" height="9"/>
    <rect x="3" y="16" width="9" height="9"/>
    <path d="M16 16h4v4h-4zM21 16h4v4h-4zM16 21h4v4h-4zM21 21h4"/>
  </svg>
</button>
<div id="status"><span id="dot"></span><span id="statustext">Connecting…</span></div>
<div id="controls">
  <div id="micwrap">
    <button id="toggle" disabled>Start captions</button>
    <button id="micbtn" aria-label="Choose microphone source" title="Choose source"
            aria-haspopup="listbox" aria-expanded="false">▾</button>
    <div id="micmenu" role="listbox" hidden></div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const id = (params.get('id') || '').toUpperCase();
const $ = (s) => document.querySelector(s);
const captions = $('#captions'), statusEl = $('#status'), statusText = $('#statustext');
const toggle = $('#toggle'), dot = $('#dot');

const MAX_OLD_LINES = 2;
let listenWs = null, sendWs = null, partialEl = null, blockEl = null, reconnectTimer = null;
const speakerSeqs = new Set();
let sourceLang = 'sv';
let audio = null, streaming = false, senderReady = false, autoStarted = false;

if (!id) {
  setStatus('No stream specified (?id= is missing).', 'error');
} else {
  init();
}

async function init() {
  const info = await fetch(`/api/sessions/${id}`).then(r => r.json()).catch(() => null);
  if (!info || info.error) {
    setStatus(`No stream found with the code ${id}.`, 'error');
    return;
  }
  sourceLang = info.sourceLang;
  $('#qr').src = info.listenQr;
  $('#code').textContent = id;
  $('#qrpanel').style.display = 'block';
  connectListener();
  connectBroadcaster();
}

function setStatus(text, cls = '') {
  statusText.textContent = text;
  statusEl.className = cls;
}

// ---- Captions in (listener websocket, source language = no translation) --
function connectListener() {
  clearTimeout(reconnectTimer);
  if (listenWs) { listenWs.onclose = null; listenWs.close(); }
  captions.innerHTML = '';
  partialEl = null;
  blockEl = null;

  const lang = params.get('lang') || sourceLang;
  listenWs = new WebSocket(`${location.origin.replace(/^http/, 'ws')}/ws/listen?id=${id}&lang=${lang}`);
  listenWs.onclose = () => { reconnectTimer = setTimeout(connectListener, 2000); };
  listenWs.onerror = () => listenWs.close();
  listenWs.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'partial') showPartial(msg.text, msg.gapBefore, msg.speaker, msg.seq, msg.speakerName);
    if (msg.type === 'final') showFinal(msg.text, msg.gapBefore, msg.speaker, msg.seq, msg.speakerName);
    if (msg.type === 'speaker') applySpeakerRetro(msg.seq);
  };
}

function currentBlock() {
  if (!blockEl || !blockEl.isConnected) {
    blockEl = document.createElement('div');
    blockEl.className = 'block';
    captions.append(blockEl);
  }
  return blockEl;
}

function prepareLine(gapBefore, speaker, seq, speakerName) {
  const isSpeaker = !!speaker || !!speakerName || speakerSeqs.has(seq);
  if (speaker) speakerSeqs.add(seq);
  if (gapBefore || isSpeaker) blockEl = null;
  return isSpeaker;
}

function speakerPrefix(isSpeaker, speakerName) {
  if (speakerName) return speakerName + ': ';
  return isSpeaker ? '— ' : '';
}

function showPartial(text, gapBefore, speaker, seq, speakerName) {
  const isSpeaker = prepareLine(gapBefore, speaker, seq, speakerName);
  if (!partialEl) {
    partialEl = document.createElement('p');
    partialEl.className = 'partial';
    currentBlock().append(partialEl);
  }
  partialEl.dataset.seq = seq;
  partialEl.classList.toggle('speaker-start', isSpeaker);
  partialEl.textContent = speakerPrefix(isSpeaker, speakerName) + text;
  ageLines();
}

function showFinal(text, gapBefore, speaker, seq, speakerName) {
  const isSpeaker = prepareLine(gapBefore, speaker, seq, speakerName);
  if (partialEl) { partialEl.remove(); partialEl = null; }
  const p = document.createElement('p');
  p.dataset.seq = seq;
  p.className = isSpeaker ? 'speaker-start' : '';
  p.textContent = speakerPrefix(isSpeaker, speakerName) + text;
  currentBlock().append(p);
  const lines = captions.querySelectorAll('p');
  if (lines.length > MAX_OLD_LINES + 1) lines[0].closest('div').childElementCount === 1
    ? lines[0].closest('div').remove()
    : lines[0].remove();
  ageLines();
}

function applySpeakerRetro(seq) {
  speakerSeqs.add(seq);
  const el = captions.querySelector(`p[data-seq="${seq}"]`);
  if (!el || el.dataset.speakerized) return;
  el.dataset.speakerized = '1';
  if (!el.textContent.startsWith('— ')) el.textContent = '— ' + el.textContent;
  el.classList.add('speaker-start');
}

function ageLines() {
  const lines = captions.querySelectorAll('p');
  for (let i = 0; i < lines.length; i++) lines[i].classList.toggle('old', i < lines.length - 1);
}

// ---- Microphone input – source menu behind the ▾ chevron -------------------
const micBtn = $('#micbtn'), micMenu = $('#micmenu');
let currentMic = localStorage.getItem('bergettolk-mic') || '';

async function listMics() {
  // Labels are only available after a getUserMedia grant (or persisted permission)
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  let n = 1;
  micMenu.innerHTML = '<div class="menu-label">Audio source</div>';
  // Pre-grant browsers (e.g. Safari) return empty deviceIds – dedupe so the
  // menu doesn't show several indistinguishable entries
  const seen = new Set(['']);
  const choices = [['', 'Default input'],
    ...devs.map(d => [d.deviceId, d.label || `Microphone ${n++}`])
      .filter(([id]) => (id ? !seen.has(id) && (seen.add(id), true) : false))];
  for (const [value, label] of choices) {
    const b = document.createElement('button');
    b.textContent = label;
    b.role = 'option';
    b.ariaSelected = value === currentMic ? 'true' : 'false';
    b.classList.toggle('cur', value === currentMic);
    b.addEventListener('click', () => pickMic(value));
    micMenu.append(b);
  }
  // saved device may be gone – fall back to default
  if (currentMic && !devs.some(d => d.deviceId === currentMic)) currentMic = '';
}
navigator.mediaDevices.addEventListener?.('devicechange', listMics);
listMics();

async function pickMic(value) {
  currentMic = value;
  localStorage.setItem('bergettolk-mic', value);
  closeMenu();
  await listMics();
  if (!streaming) return;                    // applies on next Start
  await stop();                              // hot-swap while live
  await start().catch((err) => setStatus('Could not use that input: ' + err.message, 'error'));
}

function openMenu() {
  micMenu.hidden = false;
  micBtn.setAttribute('aria-expanded', 'true');
}
function closeMenu() {
  micMenu.hidden = true;
  micBtn.setAttribute('aria-expanded', 'false');
}
micBtn.addEventListener('click', () => micMenu.hidden ? openMenu() : closeMenu());
document.addEventListener('pointerdown', (e) => {
  if (!micMenu.hidden && !e.target.closest('#micwrap')) closeMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

// ---- Audio out (broadcaster websocket) ------------------------------------
function connectBroadcaster() {
  sendWs = new WebSocket(`${location.origin.replace(/^http/, 'ws')}/ws/broadcast?id=${id}`);
  sendWs.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'state') {
      if (msg.state === 'ready') {
        senderReady = true;
        toggle.disabled = false;
        if (!streaming) {
          setStatus('Ready – starting audio…');
          // One-click flow: /live was requested via BROADCAST → start right away.
          // The only thing the user should have to do is approve the mic prompt.
          if (!autoStarted) {
            autoStarted = true;
            start().catch((err) => setStatus('Microphone access denied – press Start to retry. (' + err.message + ')', 'error'));
          }
        }
      } else if (msg.state === 'connecting') {
        setStatus('Connecting to the transcription service…');
      } else if (msg.state === 'error') {
        senderReady = false;
        toggle.disabled = true;
        setStatus('Error: ' + (msg.error || 'unknown error'), 'error');
      }
    }
    if (msg.type === 'error') setStatus('Error: ' + msg.message, 'error');
  };
  sendWs.onclose = () => {
    senderReady = false;
    toggle.disabled = true;
    if (!streaming) setStatus('Connection lost – please reload the page.', 'error');
  };
}

function toBase64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

async function start() {
  const mic = currentMic ? { deviceId: { exact: currentMic } } : {};
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, ...mic },
  });
  listMics();   // labels appear once permission exists
  const ctx = new AudioContext();
  await ctx.audioWorklet.addModule('/pcm-worklet.js');
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, 'pcm-resampler', {
    processorOptions: { targetRate: 24000 },
  });
  src.connect(node);
  node.port.onmessage = (ev) => {
    if (sendWs.readyState !== WebSocket.OPEN) return;
    sendWs.send(JSON.stringify({ type: 'audio', audio: toBase64(ev.data) }));
    // The status dot breathes with speech instead of a separate level meter
    const pcm = new Int16Array(ev.data);
    let peak = 0;
    for (let i = 0; i < pcm.length; i += 8) peak = Math.max(peak, Math.abs(pcm[i]));
    const level = Math.min(1, peak / 16000);
    dot.style.transform = `scale(${1 + level * 0.55})`;
    dot.style.boxShadow = `0 0 ${Math.round(5 + level * 16)}px #52B788`;
  };
  audio = { ctx, stream, node };
  streaming = true;
  toggle.textContent = 'Stop captions';
  toggle.classList.add('stop');
  micBtn.classList.add('stop');

  // Autoplay policy: an AudioContext created without a user gesture may start
  // suspended (the worklet then never fires). Try to wake it; if the browser
  // still refuses, one click anywhere on the screen finishes the job.
  if (ctx.state === 'suspended') {
    await ctx.resume().catch(() => {});
  }
  if (ctx.state === 'running') {
    setStatus('Streaming', 'live');
  } else {
    setStatus('Microphone connected – click anywhere on the screen to enable audio…');
    const wake = async () => {
      const ok = await ctx.resume().then(() => true).catch(() => false);
      if (ok && ctx.state === 'running') {
        setStatus('Streaming', 'live');
      } else {
        window.addEventListener('pointerdown', wake, { once: true });
      }
    };
    window.addEventListener('pointerdown', wake, { once: true });
  }
}

async function stop() {
  if (!audio) return;
  audio.node.disconnect();
  audio.stream.getTracks().forEach((t) => t.stop());
  await audio.ctx.close();
  audio = null;
  streaming = false;
  dot.style.transform = '';
  dot.style.boxShadow = '';
  toggle.textContent = 'Start captions';
  toggle.classList.remove('stop');
  micBtn.classList.remove('stop');
  if (senderReady) setStatus('Ready – streaming paused.');
}

toggle.addEventListener('click', () => (streaming ? stop() : start().catch((err) => {
  setStatus('Microphone access denied: ' + err.message, 'error');
})));

// Close/reopen the QR panel
$('#qr-close').addEventListener('click', () => {
  $('#qrpanel').style.display = 'none';
  $('#qr-open').style.display = 'block';
});
$('#qr-open').addEventListener('click', () => {
  $('#qrpanel').style.display = 'block';
  $('#qr-open').style.display = 'none';
});
</script>
</body>
</html>
